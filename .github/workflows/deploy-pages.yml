name: Deploy Static PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validate, Test & Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate static PWA and subpath invariants
        run: node scripts/validate-static-pwa.mjs --strict

      - name: Run all Node test suites
        run: |
          shopt -s nullglob
          test_files=(tests/*.mjs)
          if [ ${#test_files[@]} -eq 0 ]; then
            echo "Error: no test scripts found in tests/*.mjs"
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "Running ${test_file}..."
            node "${test_file}"
          done

      - name: Assemble _site Pages bundle
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          cp -R assets styles src _site/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
